services:
  # No Postgres service here on purpose: the app connects to the existing
  # host Postgres via the DATABASE_URL in .env.docker (134.209.64.28:5432).
  # Running a compose Postgres would collide on host port 5432 and create a
  # second, empty database.
  app:
    build: .
    ports:
      - '${PORT:-3000}:3000'
    env_file:
      - .env.docker
    restart: unless-stopped
