name: CI/CD

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  # ─── Build & Test ────────────────────────────────────────
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: viju_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/viju_test
      JWT_SECRET: ci-test-secret
      NODE_ENV: test
      PORT: 3000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run migrations
        run: npx prisma migrate deploy

      - name: Lint
        run: npm run lint --if-present

      - name: Build
        run: npm run build

      - name: Test
        run: npm test -- --passWithNoTests

  # ─── Deploy to Dev Server ───────────────────────────────
  deploy-dev:
    needs: test
    if: github.ref == 'refs/heads/dev' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: development

    steps:
      - name: Deploy to DigitalOcean
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd ${{ secrets.APP_DIR }}

            # Pull latest code
            git pull origin dev

            # Write env from secrets.
            #
            # Credentials are always secrets. The three OTP switches are
            # literals on purpose: an unset secret renders as an empty string,
            # and an empty OTP_PROVIDER silently falls back to the local
            # provider, which writes OTP codes to the container log instead of
            # sending them. A literal cannot fail that way.
            #
            # OTP_PROVIDER=ezone is what activates the EZONE_* credentials -
            # without it they are ignored entirely. EZONE_ENV must match the key
            # tier: "test" for sk_test_/pk_test_ keys, the live value from Ezone
            # for live keys; change the keys and EZONE_ENV together.
            # PRIVATE_EZONE_SECRET_KEY is the sk_... key. The pk_... public key
            # is not used by this service and is refused at run time.
            #
            # ERP_API_KEY is the x-api-key shared secret for /erp/sync/*. It is
            # REQUIRED whenever NODE_ENV=production: without it those routes
            # answer 401 instead of falling back to the dev bypass. The
            # ingest/projector server must send this exact value.
            cat > .env <<EOF
            NODE_ENV=${{ secrets.NODE_ENV }}
            PORT=${{ secrets.PORT }}
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            JWT_EXPIRATION=${{ secrets.JWT_EXPIRATION }}
            STORAGE_PROVIDER=${{ secrets.STORAGE_PROVIDER }}
            CLOUDINARY_CLOUD_NAME=${{ secrets.CLOUDINARY_CLOUD_NAME }}
            CLOUDINARY_API_KEY=${{ secrets.CLOUDINARY_API_KEY }}
            CLOUDINARY_API_SECRET=${{ secrets.CLOUDINARY_API_SECRET }}
            EMAIL_PROVIDER=${{ secrets.EMAIL_PROVIDER }}
            EMAIL_FROM=${{ secrets.EMAIL_FROM }}
            EMAIL_FROM_NAME=${{ secrets.EMAIL_FROM_NAME }}
            SMTP_HOST=${{ secrets.SMTP_HOST }}
            SMTP_PORT=${{ secrets.SMTP_PORT }}
            SMTP_USER=${{ secrets.SMTP_USER }}
            SMTP_PASS=${{ secrets.SMTP_PASS }}
            SMTP_SECURE=${{ secrets.SMTP_SECURE }}
            OTP_PROVIDER=ezone
            EZONE_OTP_BASE_URL=https://gateway.ezoneapps.com:30002/ezone-api-authservice/api/v1/otp
            EZONE_ENV=test
            EZONE_ORGANIZATION_KEY=${{ secrets.EZONE_ORGANIZATION_KEY }}
            PRIVATE_EZONE_SECRET_KEY=${{ secrets.PRIVATE_EZONE_SECRET_KEY }}
            ERP_API_KEY=${{ secrets.ERP_API_KEY }}
            EOF

            # Build and restart (app-only, no postgres container)
            docker-compose -f docker-compose.prod.yml down
            docker-compose -f docker-compose.prod.yml up --build -d

            # Cleanup old images
            docker image prune -f
